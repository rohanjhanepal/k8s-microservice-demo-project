apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow-ingress
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic to frontend from anywhere (cluster + external via Service).
    - ports:
        - protocol: TCP
          port: 8080
