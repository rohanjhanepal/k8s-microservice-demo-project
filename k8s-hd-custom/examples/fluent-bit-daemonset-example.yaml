# =============================================================================
# OPTIONAL EXAMPLE — NOT applied by kustomization.yaml.
# Demonstrates a DaemonSet-based log collector pattern without requiring ES/Loki.
# Fluent Bit can forward to stdout, files, or cloud sinks (configure OUTPUT).
# Review RBAC/hostPath needs before applying on real clusters.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: fluent-bit-example
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config-example
  namespace: fluent-bit-example
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
    [INPUT]
        Name   dummy
        Dummy  {"message":"fluent-bit-example-not-connected-to-app-logs"}
    [OUTPUT]
        Name   stdout
        Match  *
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit-example
  namespace: fluent-bit-example
spec:
  selector:
    matchLabels:
      app: fluent-bit-example
  template:
    metadata:
      labels:
        app: fluent-bit-example
    spec:
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.1.9
          args:
            - -c
            - /fluent-bit/etc/fluent-bit.conf
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config-example
